name: Bump Casks

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.10.19.1

      - name: Bump casks (livecheck)
        uses: LanikSJ/homebrew-bump-cask@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: rmtsrc/notorious-cask
          livecheck: true

      - name: Auto-merge bump PRs from the token owner
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          author_login="$(gh api user --jq '.login')"
          echo "Authenticated GitHub user: ${author_login}"

          mapfile -t prs < <(
            gh pr list --repo rmtsrc/notorious-cask --state open --limit 100 \
              --author "${author_login}" --json number,headRefName,author \
              --jq '.[] | select(.headRefName|startswith("bump-")) | .number'
          )

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No open bump PRs authored by ${author_login} to auto-merge."
            exit 0
          fi

          for pr in "${prs[@]}"; do
            echo "Enabling auto-merge for PR #${pr}"
            gh pr merge "${pr}" --repo rmtsrc/notorious-cask --auto --merge --delete-branch
          done
