name: Bump Casks

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.10.19.1

      - name: Bump casks (livecheck)
        uses: LanikSJ/homebrew-bump-cask@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: rmtsrc/notorious-cask
          livecheck: true
