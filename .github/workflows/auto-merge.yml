name: Auto-merge
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Security check: ensure the PR author is the official dependabot[bot].
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == 'rmtsrc/notorious-cask'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.HOMEBREW_TAP_TOKEN }}"

      - name: Approve and enable auto-merge for non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          sleep 5
          gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  cask-bump:
    runs-on: ubuntu-latest
    # Only merge PRs created by the tap update workflow for this repo.
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'rmtsrc' &&
      startsWith(github.event.pull_request.head.ref, 'bump-') &&
      github.event.pull_request.head.repo.full_name == 'rmtsrc/notorious-cask'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Approve and auto-merge bump PRs
        run: |
          gh pr review --approve "$PR_URL"
          sleep 5
          gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
