name: Auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.HOMEBREW_TAP_TOKEN }}"

      - name: Approve and auto-merge allowed PRs
        if: |
          (github.event.pull_request.user.login == 'dependabot[bot]' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major') ||
          (github.event.pull_request.user.login == 'rmtsrc' &&
          startsWith(github.event.pull_request.head.ref, 'bump-'))
        run: gh pr merge --auto --squash "$PR_URL" --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
