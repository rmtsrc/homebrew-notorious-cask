name: Auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Security check: ensures the actor is exactly the official dependabot[bot]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.HOMEBREW_TAP_TOKEN }}"

      - name: Approve and Enable auto-merge for non-major updates
        # Restrict auto-merge to non-major updates (patch/minor)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          # Small sleep to ensure the PR state is up to date
          sleep 5
          # Try to enable auto-merge, falling back to regular squash if auto-merge fails
          gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  cask-bump:
    runs-on: ubuntu-latest
    # Only merge PRs created by the tap update workflow, not arbitrary PRs.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'rmtsrc' &&
      github.actor == 'rmtsrc' &&
      startsWith(github.head_ref, 'bump-') &&
      github.event.pull_request.head.repo.full_name == 'rmtsrc/notorious-cask'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Approve and auto-merge bump PRs
        run: |
          gh pr review --approve "$PR_URL"
          sleep 5
          gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
